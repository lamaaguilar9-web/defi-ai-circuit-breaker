name: DeFi AI Circuit Breaker CI & Invariant Certification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Core Test Suite (31 Tests)
        env:
          PYTHONPATH: .
        run: python -m pytest tests/ -v

      - name: Run Formal Mathematical Invariant Fuzzing (5,000 Iterations)
        env:
          PYTHONPATH: .
        run: python tests/fuzz_invariants.py
