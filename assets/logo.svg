<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080b11"/>
      <stop offset="50%" stop-color="#0d1527"/>
      <stop offset="100%" stop-color="#05070a"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#f0b90b"/>
    </linearGradient>
    <linearGradient id="circuitGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" rx="160" fill="url(#bgGrad)"/>
  <rect width="792" height="792" x="4" y="4" rx="156" fill="none" stroke="#1e293b" stroke-width="2"/>

  <!-- Outer Cyber Ring -->
  <circle cx="400" cy="360" r="260" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="6 8"/>
  <circle cx="400" cy="360" r="280" fill="none" stroke="#0f172a" stroke-width="1"/>

  <!-- Circuit Trace Lines -->
  <g stroke="url(#circuitGrad)" stroke-width="2.5" fill="none">
    <path d="M 160 360 L 260 360 L 300 320" />
    <path d="M 640 360 L 540 360 L 500 400" />
    <path d="M 400 120 L 400 200" />
    <path d="M 280 190 L 340 250" />
    <path d="M 520 190 L 460 250" />
    <circle cx="160" cy="360" r="5" fill="#10b981"/>
    <circle cx="640" cy="360" r="5" fill="#06b6d4"/>
    <circle cx="400" cy="120" r="5" fill="#10b981"/>
  </g>

  <!-- Shield Outer Glow -->
  <path d="M 400 170 L 550 230 C 550 400 400 510 400 510 C 400 510 250 400 250 230 Z" 
        fill="none" stroke="url(#shieldGrad)" stroke-width="16" filter="url(#glow)" opacity="0.45"/>

  <!-- Shield Core -->
  <path d="M 400 170 L 550 230 C 550 400 400 510 400 510 C 400 510 250 400 250 230 Z" 
        fill="#090d16" stroke="url(#shieldGrad)" stroke-width="6"/>

  <!-- Inner Geometric Plate -->
  <path d="M 400 205 L 515 255 C 515 385 400 470 400 470 C 400 470 285 385 285 255 Z" 
        fill="#0d1527" stroke="#1e293b" stroke-width="2"/>

  <!-- Lightning Circuit Breaker Slice -->
  <path d="M 425 230 L 350 345 L 430 345 L 370 460 L 455 335 L 385 335 Z" 
        fill="url(#goldGrad)" filter="url(#glow)"/>

  <!-- Core Pulse Nodes -->
  <circle cx="400" cy="350" r="6" fill="#ffffff"/>

  <!-- Branding Text -->
  <text x="400" y="630" font-family="'Inter', -apple-system, sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="6">
    DEFI AI
  </text>
  <text x="400" y="675" font-family="'Inter', -apple-system, sans-serif" font-size="24" font-weight="800" fill="#10b981" text-anchor="middle" letter-spacing="4">
    CIRCUIT BREAKER
  </text>
  <text x="400" y="715" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="600" fill="#64748b" text-anchor="middle" letter-spacing="3">
    AUTONOMOUS LIQUIDITY GUARDIAN • &lt;50MS
  </text>
</svg>